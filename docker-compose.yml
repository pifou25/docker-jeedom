networks:
  default:
    name: jeedom_network

services:
  db:
    # image: mariadb # for pi3/4: ghcr.io/linuxserver/mariadb
    # hdi.io image require login to hdi.io
    image: dhi.io/mariadb:13
    # image: mariadb # for pi3/4: ghcr.io/linuxserver/mariadb
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-password}
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_JEEDOM_DB=${MYSQL_JEEDOM_DB:-jeedom}
      - MYSQL_JEEDOM_USER=${MYSQL_JEEDOM_USER:-jeedom}
      - MYSQL_JEEDOM_PASSWD=${MYSQL_JEEDOM_PASSWD:-jeedom}
    healthcheck:
      test: ["CMD", "mariadb-admin" ,"ping", "-h", "localhost", "-u", "root", "-p$${MARIADB_ROOT_PASSWORD:-password}"]
      interval: 1m30s
      retries: 3
      start_period: 40s
      timeout: 20s
    volumes:
      # database filesystem
      - ./volumes/db:/var/lib/mysql
    ports:
      - 3306:3306
    labels:
      # label chadburn for the "cron" container
      chadburn.enabled: "true"
      chadburn.job-exec.jeedom-backup.schedule: "@every 1d"
      chadburn.job-exec.jeedom-backup.command: "mysqldump -d${MYSQL_JEEDOM_DB:-jeedom} -u${MYSQL_JEEDOM_USER:-jeedom} -p\"${MYSQL_JEEDOM_PASSWD:-jeedom}\"' > /backup/jeedom.sql"


  db-init:
    # dhi.io/mariadb has no shell, using -dev variant to init database with scripts
    image: dhi.io/mariadb:13-dev
    restart: no
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # directory for init sql and scripts
      - ./init.db/script:/scripts
    environment:
      - PUID=1000
      - PGID=1000
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-password}
      - MARIADB_HOST=db
      - MARIADB_MYSQL_LOCALHOST_USER=1
      - MARIADB_MYSQL_LOCALHOST_GRANTS=USAGE
      - TZ=${TZ:-Europe/Paris}
      - MYSQL_JEEDOM_DB=${MYSQL_JEEDOM_DB:-jeedom}
      - MYSQL_JEEDOM_USER=${MYSQL_JEEDOM_USER:-jeedom}
      - MYSQL_JEEDOM_PASSWD=${MYSQL_JEEDOM_PASSWD:-jeedom}
      - MYSQL_NPM_USER=${MYSQL_NPM_USER:-npm}
      - MYSQL_NPM_PASSWORD=${MYSQL_NPM_PASSWORD:-npm}
      - MYSQL_VAULT_USER=${MYSQL_VAULT_USER:-vault}
      - MYSQL_VAULT_PASSWORD=${MYSQL_VAULT_PASSWORD:-vault}
    command: >
      sh -c 'sleep 5 &&
             for f in /scripts/*; do
               case "$$f" in
                 *.sh) sh "$$f";;
                 *.sql.gz) zcat "$$f" | mariadb -u root -p"$$MARIADB_ROOT_PASSWORD";;
                 *.sql) mariadb -u root -p"$$MARIADB_ROOT_PASSWORD" < "$$f";;
               esac; done'
    logging:
      options:
        max-size: "10m"
        max-file: "1"


  jeedom:
    # build your own image first with build-args and target:
    # build:
    #  context: ./build
    #  target: light_jeedom # add target if required
    #  args:
    #    JEEDOM_VERSION: master
    #    XDEBUG: true
    # OR use existing ready-to-go image:
    image: pifou25/jeedom:light
    hostname: jeedom
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-password}
      - MYSQL_JEEDOM_DB=${MYSQL_JEEDOM_DB:-jeedom}
      - MYSQL_JEEDOM_USER=${MYSQL_JEEDOM_USER:-jeedom}
      - MYSQL_JEEDOM_PASSWD=${MYSQL_JEEDOM_PASSWD:-jeedom}
      - JEEDOM_VERSION=${JEEDOM_VERSION:-master}
      - MYSQL_HOST=db
      - TZ=${TZ:-Europe/Paris}
    restart: unless-stopped
    volumes:
      - ./volumes/jeedom:/var/www/html
      - ./volumes/backup:/tmp/backup
    tmpfs:
      - /tmp/jeedom
    healthcheck:
      test: ["CMD-SHELL", "curl -so /tmp/status http://localhost/here.html || exit 1"]
      interval: 1m30s
      retries: 3
      start_period: 40s
      timeout: 20s
    ports:
      - "80:80"
    labels:
      # label chadburn for the "cron" container
      chadburn.enabled: "true"
      chadburn.job-exec.jeedom-cron.schedule: "@every 1m"
      chadburn.job-exec.jeedom-cron.command: "/usr/local/bin/php /var/www/html/core/php/jeeCron.php >> /var/www/html/log/cron.log 2>&1"
      # label for watchtower: don't check
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      db:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "1"


  # Scheduler Service: mcuadros/ofelia or premoweb/chadburn
  scheduler:
    image: premoweb/chadburn
    environment:
      - TZ=${tz:-Europe/Paris}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: daemon
    logging:
      options:
        max-size: "10m"
        max-file: "1"


  adminer:
    image: adminer
    depends_on:
      db:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    ports:
      - 8080:8080


  # On peux ajouter également Node-red. permettant une gestion de mqtt native
  node-red:
    # profiles: ["nodered"]
    image:  nodered/node-red
    volumes:
    - ./volumes/nodered:/data  # remplacer ./volumes par l'emplacement du volume souhaité
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

  # redis service for cache
  redis:
    image: redis
    volumes:
    - ./volumes/cache:/data
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    ports:
      - 6379:6379